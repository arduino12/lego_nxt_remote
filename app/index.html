<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>NXT Remote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=0.1.0">
</head>
<body>
  <header>
    <h1 data-t="title"></h1>
    <button id="langBtn" class="ghost small"></button>
  </header>

  <section class="card">
    <div class="row">
      <button id="connectBtn" class="primary grow"></button>
      <button id="usbBtn" class="ghost" data-t="usb" hidden></button>
    </div>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="stName">—</span>
      <span class="sep">·</span>
      <span id="stBat">—</span>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <nav class="tabs">
    <button data-tab="drive" data-t="tabDrive" class="active"></button>
    <button data-tab="path" data-t="tabPath"></button>
    <button data-tab="brick" data-t="tabBrick"></button>
  </nav>

  <main>
    <section id="tab-drive" class="tab">
      <div class="card">
        <div id="joy" class="joy">
          <div class="joy-cross"></div>
          <div id="knob" class="knob"></div>
        </div>
        <p class="hint center" data-t="joyHint"></p>
        <div class="row ltr">
          <button id="stepL" class="grow" data-t="stepLeft"></button>
          <button id="beepBtn" class="ghost">🔊</button>
          <button id="stepR" class="grow" data-t="stepRight"></button>
        </div>
        <label class="slider"><span data-t="drivePower"></span> <b id="drivePowerVal"></b>
          <input type="range" id="drivePower" min="20" max="100" step="5"></label>
      </div>
    </section>

    <section id="tab-path" class="tab" hidden>
      <div class="card">
        <canvas id="pathCanvas" class="path"></canvas>
        <p id="pathInfo" class="hint center"></p>
        <div class="row">
          <button id="undoBtn" class="ghost" data-t="undo"></button>
          <button id="clearBtn" class="ghost" data-t="clear"></button>
          <button id="runBtn" class="primary grow" data-t="run"></button>
        </div>
        <label class="field"><span data-t="area"></span>
          <select id="area"><option value="100">1 × 1 m</option><option value="200">2 × 2 m</option><option value="300">3 × 3 m</option><option value="500">5 × 5 m</option></select></label>
      </div>
    </section>

    <section id="tab-brick" class="tab" hidden>
      <div class="card">
        <h2 data-t="screen"></h2>
        <canvas id="lcd" class="lcd" width="100" height="64"></canvas>
        <div class="row nxt-buttons">
          <button data-btn="1">◀</button>
          <button data-btn="2" class="orange">●</button>
          <button data-btn="3">▶</button>
          <button data-btn="4" class="dark">✕</button>
        </div>
        <label class="check"><input type="checkbox" id="lcdLive" checked> <span data-t="lcdLive"></span></label>
        <p id="btState" class="hint"></p>
      </div>

      <div class="card">
        <h2 data-t="homeTitle"></h2>
        <p class="hint" data-t="homeHint"></p>
        <div class="jog"><b>B</b> <span id="posB" class="num">—</span>
          <button data-jog="1,-15">−15°</button><button data-jog="1,-2">−2°</button><button data-jog="1,2">+2°</button><button data-jog="1,15">+15°</button></div>
        <div class="jog"><b>C</b> <span id="posC" class="num">—</span>
          <button data-jog="2,-15">−15°</button><button data-jog="2,-2">−2°</button><button data-jog="2,2">+2°</button><button data-jog="2,15">+15°</button></div>
        <div class="row">
          <button id="setHomeBtn" class="primary grow" data-t="setHome"></button>
          <button id="goHomeBtn" class="ghost grow" data-t="goHome"></button>
        </div>
      </div>

      <div class="card">
        <h2 data-t="calTitle"></h2>
        <p class="hint" data-t="calHint"></p>
        <div class="row">
          <button id="calDriveBtn" class="ghost grow" data-t="calDrive"></button>
          <input id="calCm" type="number" inputmode="decimal" min="1" step="0.5" class="grow">
          <button id="calSaveBtn" class="primary" data-t="save"></button>
        </div>
        <p id="calInfo" class="hint"></p>
        <label class="check"><input type="checkbox" data-cfg="invA"> <span data-t="invA"></span></label>
        <label class="check"><input type="checkbox" data-cfg="invSide"> <span data-t="invSide"></span></label>
        <label class="check"><input type="checkbox" data-cfg="invB"> <span data-t="invB"></span></label>
        <label class="check"><input type="checkbox" data-cfg="invC"> <span data-t="invC"></span></label>
        <label class="slider"><span data-t="sidePower"></span> <b id="sidePowerVal"></b>
          <input type="range" id="sidePower" min="20" max="100" step="5"></label>
        <label class="check"><input type="checkbox" data-cfg="deadman"> <span data-t="deadman"></span></label>
      </div>

      <div class="card">
        <h2 data-t="infoTitle"></h2>
        <dl class="info">
          <dt data-t="firmware"></dt><dd id="infoFw">—</dd>
          <dt data-t="btAddr"></dt><dd id="infoAddr">—</dd>
          <dt data-t="battery"></dt><dd id="infoBat">—</dd>
        </dl>
        <div class="row">
          <input id="nameInput" maxlength="15" class="grow">
          <button id="renameBtn" class="ghost" data-t="rename"></button>
        </div>
      </div>
    </section>
  </main>

  <button id="stopBtn" class="stop" data-t="stop"></button>
  <footer id="footer"></footer>

  <script type="module" src="app.js?v=0.1.0"></script>
</body>
</html>
